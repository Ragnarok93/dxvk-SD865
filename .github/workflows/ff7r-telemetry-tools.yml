name: FF7R telemetry tooling tests

on:
  push:
    branches:
      - feature/ff7r-adreno650-telemetry-20261014
    paths:
      - 'tools/ff7r_perf_compare.py'
      - 'tests/test_ff7r_perf_compare.py'
      - 'tools/ff7r_phase0_report.py'
      - 'tests/test_ff7r_phase0_report.py'
      - '.github/workflows/ff7r-telemetry-tools.yml'
  pull_request:
    paths:
      - 'tools/ff7r_perf_compare.py'
      - 'tests/test_ff7r_perf_compare.py'
      - 'tools/ff7r_phase0_report.py'
      - 'tests/test_ff7r_phase0_report.py'
      - '.github/workflows/ff7r-telemetry-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Telemetry parser and report tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Test FF7R performance comparison parser
        run: python -m unittest discover -s tests -p 'test_ff7r_perf_compare.py' -v

      - name: Test FF7R phase-0 report parser
        run: python -m unittest discover -s tests -p 'test_ff7r_phase0_report.py' -v
