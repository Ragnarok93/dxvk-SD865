name: GameNative DXVK WCP

on:
  push:
    branches:
      - master
      - 'feature/sd865-*'
      - 'prerelease/ff7remake-t30-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: gamenative-wcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gamenative-wcp:
    name: Build GameNative DXVK (.wcp)
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
      - name: Install compiler and packager dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja mingw-w64-gcc glslang python zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout DXVK and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Compile Windows x86 and x64 DLLs for GameNative
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="sd865-${GITHUB_SHA:0:12}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          ./package-release.sh "$VERSION_NAME" build --no-package
          test -f "build/dxvk-${VERSION_NAME}/x64/d3d11.dll"
          test -f "build/dxvk-${VERSION_NAME}/x32/d3d11.dll"
          test -f "build/dxvk-${VERSION_NAME}/x64/dxgi.dll"
          test -f "build/dxvk-${VERSION_NAME}/x32/dxgi.dll"

      - name: Package and validate only the .wcp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package_gamenative_wcp.py \
            --input "build/dxvk-${VERSION_NAME}" \
            --output "dist/dxvk-${VERSION_NAME}.wcp" \
            --version-name "$VERSION_NAME"
          test "$(find dist -maxdepth 1 -type f -name '*.wcp' | wc -l)" -eq 1
          zstd -t "dist/dxvk-${VERSION_NAME}.wcp"
          zstd -dc "dist/dxvk-${VERSION_NAME}.wcp" \
            | tar -tf - > /tmp/dxvk-sd865-wcp-files.txt
          grep -qx 'profile.json' /tmp/dxvk-sd865-wcp-files.txt
          grep -qx 'x64/d3d11.dll' /tmp/dxvk-sd865-wcp-files.txt
          grep -qx 'x32/d3d11.dll' /tmp/dxvk-sd865-wcp-files.txt
          grep -qx 'x64/dxgi.dll' /tmp/dxvk-sd865-wcp-files.txt
          grep -qx 'x32/dxgi.dll' /tmp/dxvk-sd865-wcp-files.txt
          # GameNative extracts tar members in order; directory records are mandatory.
          grep -Eq '^x32/?$' /tmp/dxvk-sd865-wcp-files.txt
          grep -Eq '^x64/?$' /tmp/dxvk-sd865-wcp-files.txt

      # GitHub Actions automatically wraps all downloadable artifacts in ZIPs.
      # The ONLY build payload within the download is this single .wcp.
      - name: Upload GameNative WCP only
        uses: actions/upload-artifact@v7
        with:
          name: gamenative-dxvk-${{ github.sha }}
          path: dist/*.wcp
          if-no-files-found: error
          compression-level: 0
