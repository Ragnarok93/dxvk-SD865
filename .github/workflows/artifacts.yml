name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

jobs:
  artifacts-mingw-w64:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
    - name: Setup container
      run: |
        pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Build release
      id: build-release
      run: |
        export VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        ./package-release.sh ${VERSION_NAME} build --no-package
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-win-${{ env.VERSION_NAME }}
        path: build/dxvk-${{ env.VERSION_NAME }}
        if-no-files-found: error

  artifacts-steamrt-sniper:
    runs-on: ubuntu-latest
    container: 
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:beta
      options: --user 1001

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Build release
      id: build-release
      shell: bash
      run: |
        export VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        ./package-native.sh ${VERSION_NAME} build
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-native-${{ env.VERSION_NAME }}
        path: build/dxvk-native-${{ env.VERSION_NAME }}.tar.gz
        if-no-files-found: error


  gamenative-wcp:
    name: GameNative installable DXVK (.wcp)
    needs: [artifacts-mingw-w64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zstd and derive artifact name
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          echo "VERSION_NAME=${GITHUB_REF##*/}-${GITHUB_SHA##*/}" >> "$GITHUB_ENV"
      - name: Download PE DLL build
        uses: actions/download-artifact@v4
        with:
          name: dxvk-win-${{ env.VERSION_NAME }}
          path: built-dxvk
      - name: Package GameNative WCP
        shell: bash
        run: |
          python3 tools/package_gamenative_wcp.py \
            --input built-dxvk \
            --output "dist/dxvk-sd865-${GITHUB_SHA}.wcp" \
            --version-name "sd865-${GITHUB_SHA}"
          zstd -t "dist/dxvk-sd865-${GITHUB_SHA}.wcp"
          zstd -dc "dist/dxvk-sd865-${GITHUB_SHA}.wcp" | tar -tf - | grep -x 'profile.json'
      - name: Upload GameNative component
        uses: actions/upload-artifact@v7
        with:
          name: gamenative-dxvk-sd865-${{ github.sha }}
          path: dist/*.wcp
          if-no-files-found: error

  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [artifacts-mingw-w64, artifacts-steamrt-sniper]
    steps:
      - name: Get version
        id: get-version
        shell: bash
        run: |
          echo "VERSION_NAME=${GITHUB_REF##*/}-${GITHUB_SHA##*/}" >> $GITHUB_ENV

      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: dxvk-${{ env.VERSION_NAME }}
          pattern: dxvk*
          delete-merged: true
