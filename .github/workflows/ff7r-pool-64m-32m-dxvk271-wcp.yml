name: FF7R SD865 DXVK 2.7.1 pool 64/32MiB experimental WCP

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ff7r-sd865-architecture-20261011
    paths:
      - '.github/workflows/ff7r-pool-64m-32m-dxvk271-wcp.yml'
      - 'src/d3d11/d3d11_main.cpp'
      - 'src/dxgi/dxgi_swapchain.cpp'
      - 'src/dxvk/dxvk_memory.cpp'
      - 'tests/test_ff7r_pool_experiment.py'
      - 'package-release.sh'
      - 'tools/ff7r_alloc_trace_report.py'
      - 'tests/test_ff7r_alloc_trace_report.py'
      - 'tools/ff7r_phase0_report.py'
      - 'tests/test_ff7r_phase0_report.py'
      - 'tools/package_gamenative_wcp.py'
      - 'tests/test_gamenative_wcp.py'
      - 'docs/FF7R-SD865-OPTIMIZATION-ARCHITECTURE.md'

permissions:
  contents: write

jobs:
  build:
    name: Build FF7R 2.7.1 allocator probe x64/x32 WCP
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja mingw-w64-gcc glslang python zstd github-cli
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout pinned 2.7.1 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact DXVK 2.7.1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c3dd74be6baec53786d4e064a572185b70347a17 HEAD
          test "$(git show c3dd74be6baec53786d4e064a572185b70347a17:src/dxvk/dxvk_version.h | grep -c '2.7.1' || true)" -ge 0
          echo "Verified source branch descends from exact DXVK 2.7.1 release commit"
          python3 -m unittest discover -s tests -p test_gamenative_wcp.py -v

      - name: Verify render-pass wrapper native tests
        run: python3 -m unittest discover -s tests -p 'test_ff7r_render_pass*.py' -v

      - name: Verify attribution tests
        run: python3 -m unittest discover -s tests -p 'test_ff7r_phase0_report.py' -v

      - name: Verify allocator parser and source contracts
        run: python3 -m unittest discover -s tests -p 'test_ff7r_alloc_trace_report.py' -v

      - name: Verify pool experiment policy contracts
        run: python3 -m unittest discover -s tests -p 'test_ff7r_pool_experiment.py' -v

      - name: Verify diagnostic labels and non-invasive implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DXVK_SD865_ALLOC_TRACE' src/dxvk/dxvk_memory.cpp
          # package-release.sh uses Bash extglob patterns; enable during parsing.
          bash -O extglob -n package-release.sh
          grep -Fq 'DXVK_SD865_DIAG_WCP' package-release.sh
          grep -Fq 'DXVK_SD865_ALLOC_DIAG_WCP' src/dxvk/dxvk_memory.cpp
          grep -Fq 'stage=driver_retry' src/dxvk/dxvk_memory.cpp
          grep -Fq 'retry_vkresult=' src/dxvk/dxvk_memory.cpp
          grep -Fq 'stage=pool_exhausted' src/dxvk/dxvk_memory.cpp
          grep -Fq 'DXVK-SD865-POOL state=init' src/dxvk/dxvk_memory.cpp
          grep -Fq 'DXVK_SD865_POOL_WCP' package-release.sh
          grep -Fq 'DXVK_SD865_POOL_EXPERIMENT' src/dxvk/dxvk_memory.cpp

      - name: Cross-compile PE x64 and x32
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="ff7r-renderpass-dxvk271-${GITHUB_SHA:0:12}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/__DXVK_SD865_BUILD_SHA__/${GITHUB_SHA}/" src/util/util_ff7r_build_stamp.h
          grep -Fq "$GITHUB_SHA" src/util/util_ff7r_build_stamp.h
          # Selecting this uniquely named diagnostic WCP is the opt-in.
          # Compile with an explicit define, so regular WCP builds stay inert.
          DXVK_SD865_POOL_WCP=1 ./package-release.sh "$VERSION_NAME" build --no-package
          for arch in x32 x64; do
            for dll in d3d9.dll d3d10core.dll d3d11.dll dxgi.dll; do
              test -s "build/dxvk-$VERSION_NAME/$arch/$dll"
            done
            grep -aFq 'DXVK-SD865-ALLOC state=ready' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            for dll in d3d11.dll dxgi.dll; do
              grep -aFq "$GITHUB_SHA" "build/dxvk-$VERSION_NAME/$arch/$dll"
              grep -aFq 'DXVK-SD865-BUILD:' "build/dxvk-$VERSION_NAME/$arch/$dll"
            done
            grep -aFq 'DXVK-FF7R-RENDER-PASS' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-FF7R-GPU-WAIT:' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-SD865-CONFIG:' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-SD865-ALLOC stage=driver_retry' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK_SD865_ALLOC_TRACE' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-SD865-POOL state=init' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK_SD865_POOL_EXPERIMENT' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
          done
          echo "Verified embedded diagnostic bootstrap and real VkResult markers in PE x64 and x32"

      - name: Package only GameNative WCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package_gamenative_wcp.py \
            --input "build/dxvk-$VERSION_NAME" \
            --output "dist/dxvk-$VERSION_NAME.wcp" \
            --version-name "$VERSION_NAME"
          test "$(find dist -maxdepth 1 -name '*.wcp' -type f | wc -l)" -eq 1
          zstd -t "dist/dxvk-$VERSION_NAME.wcp"
          zstd -dc "dist/dxvk-$VERSION_NAME.wcp" | tar -tf - > /tmp/wcp-contents.txt
          grep -qx 'profile.json' /tmp/wcp-contents.txt
          grep -Eq '^x32/?$' /tmp/wcp-contents.txt
          grep -Eq '^x64/?$' /tmp/wcp-contents.txt
          for dll in 'x32/d3d11.dll' 'x64/d3d11.dll' 'x32/dxgi.dll' 'x64/dxgi.dll'; do
            grep -qx "$dll" /tmp/wcp-contents.txt
          done
          sha256sum "dist/dxvk-$VERSION_NAME.wcp" > "dist/SHA256SUMS"

      - name: Upload WCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff7r-pool64m32m-dxvk271-gamenative
          path: dist/*.wcp
          if-no-files-found: error
          compression-level: 0

      - name: Publish opted-in diagnostic prerelease
        if: ${{ false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="ff7r-pool64m32m-dxvk271-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            "dist/dxvk-$VERSION_NAME.wcp" \
            "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "FF7 Remake SD865 — DXVK 2.7.1 experimental 64/32 MiB pool reclaim WCP" \
            --notes-file docs/FF7R-SD865-DEVICE-OOM-ZERO-OVERRIDE-20261011.md \
            --prerelease --latest=false
