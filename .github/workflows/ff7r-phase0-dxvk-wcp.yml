name: FF7R Phase-0 DXVK 2.7.1 diagnostic WCP

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ff7r-adreno650-telemetry-20261014
    paths:
      - '.github/workflows/ff7r-phase0-dxvk-wcp.yml'
      - 'src/**'
      - 'include/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'package-release.sh'
      - 'build-win*.txt'
      - 'tests/**'
      - 'tools/ff7r_phase0_report.py'
      - 'tests/test_ff7r_phase0_report.py'
      - 'tools/package_gamenative_wcp.py'
      - 'tests/test_gamenative_wcp.py'
      - 'docs/FF7R-SD865-OPTIMIZATION-ARCHITECTURE.md'

permissions:
  contents: write

jobs:
  build:
    name: Build 2.7.1 x64 and x32 WCP
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja mingw-w64-gcc glslang python zstd github-cli
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout pinned 2.7.1 source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact DXVK 2.7.1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c3dd74be6baec53786d4e064a572185b70347a17 HEAD
          test "$(git show c3dd74be6baec53786d4e064a572185b70347a17:src/dxvk/dxvk_version.h | grep -c '2.7.1' || true)" -ge 0
          echo "Verified source branch descends from exact DXVK 2.7.1 release commit"
          python3 -m unittest discover -s tests -p test_gamenative_wcp.py -v

      - name: Verify attribution tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify per-attempt allocator trace contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'traceAttemptId != 0u' src/dxvk/dxvk_memory.cpp
          grep -Fq 'attempt_id=", traceAttemptId' src/dxvk/dxvk_memory.cpp
          grep -Fq 'pass_reclaimed_chunks=' src/dxvk/dxvk_memory.cpp
          grep -Fq 'uint64_t               traceAttemptId = 0u' src/dxvk/dxvk_memory.h

      - name: Cross-compile PE x64 and x32
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="ff7r-verified-dxvk271-${GITHUB_SHA:0:12}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/__DXVK_SD865_BUILD_SHA__/${GITHUB_SHA}/" src/util/util_ff7r_build_stamp.h
          grep -Fq "$GITHUB_SHA" src/util/util_ff7r_build_stamp.h
          ./package-release.sh "$VERSION_NAME" build --no-package
          for arch in x32 x64; do
            for dll in d3d9.dll d3d10core.dll d3d11.dll dxgi.dll; do
              test -s "build/dxvk-$VERSION_NAME/$arch/$dll"
            done
            # Both DLLs must contain the precise CI commit and the contract,
            # otherwise their logs cannot prove active WCP installation.
            for dll in d3d11.dll dxgi.dll; do
              grep -aFq "$GITHUB_SHA" "build/dxvk-$VERSION_NAME/$arch/$dll"
              grep -aFq 'DXVK-SD865-BUILD:' "build/dxvk-$VERSION_NAME/$arch/$dll"
            done
            grep -aFq 'DXVK-SD865-CONFIG:' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-SD865-ALLOC state=ready' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-FF7R-GPU-WAIT:' "build/dxvk-$VERSION_NAME/$arch/d3d11.dll"
            grep -aFq 'DXVK-FF7R-QUEUE-SUBMIT:' "build/dxvk-$VERSION_NAME/$arch/dxgi.dll"
          done

      - name: Package only GameNative WCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package_gamenative_wcp.py \
            --input "build/dxvk-$VERSION_NAME" \
            --output "dist/dxvk-$VERSION_NAME.wcp" \
            --version-name "$VERSION_NAME"
          test "$(find dist -maxdepth 1 -name '*.wcp' -type f | wc -l)" -eq 1
          zstd -t "dist/dxvk-$VERSION_NAME.wcp"
          zstd -dc "dist/dxvk-$VERSION_NAME.wcp" | tar -tf - > /tmp/wcp-contents.txt
          grep -qx 'profile.json' /tmp/wcp-contents.txt
          grep -Eq '^x32/?$' /tmp/wcp-contents.txt
          grep -Eq '^x64/?$' /tmp/wcp-contents.txt
          for dll in 'x32/d3d11.dll' 'x64/d3d11.dll' 'x32/dxgi.dll' 'x64/dxgi.dll'; do
            grep -qx "$dll" /tmp/wcp-contents.txt
          done
          sha256sum "dist/dxvk-$VERSION_NAME.wcp" > "dist/SHA256SUMS"

      - name: Upload WCP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ff7r-phase0-dxvk271-gamenative
          path: dist/*.wcp
          if-no-files-found: error
          compression-level: 0

      - name: Publish opted-in diagnostic prerelease
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="ff7r-phase0-dxvk271-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            "dist/dxvk-$VERSION_NAME.wcp" \
            "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "FF7 Remake SD865 — DXVK 2.7.1 Phase-0 diagnostics WCP" \
            --notes-file docs/FF7R-SD865-OPTIMIZATION-ARCHITECTURE.md \
            --prerelease --latest=false
